[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "travelpilot-ai"
version = "0.1.0"
description = "Intelligent Travel Planning Agent with RAG, Knowledge Graph, LangGraph and Deterministic Validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "streamlit>=1.38.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "groq>=0.9.0",
    "neo4j>=5.20.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
